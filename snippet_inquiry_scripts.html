<script>
function submitInquiry(e) {
    e.preventDefault();
    
    const form = document.getElementById('inquiry-form');
    const formData = new FormData(form);
    
    const name = formData.get('name');
    const contact = formData.get('contact');
    const email = formData.get('email');
    const subject = formData.get('subject');
    const message = formData.get('message');
    
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const dateStr = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    
    const newInquiry = {
        id: 'inq_' + Date.now(),
        status: 'wait',
        date: dateStr,
        name: name,
        contact: contact,
        email: email,
        type: '일반 문의',
        subject: subject,
        message: message
    };
    
    let inquiries = JSON.parse(localStorage.getItem('batech_inquiries') || '[]');
    inquiries.unshift(newInquiry);
    localStorage.setItem('batech_inquiries', JSON.stringify(inquiries));
    
    alert('고객님의 문의가 성공적으로 접수되었습니다.\n담당자가 확인 후 입력하신 이메일(' + email + ')로 답변을 드리겠습니다.');
    form.reset();
}

function deleteInquiry(id, email) {
    // stop propagation so the click doesn't toggle accordion again if clicked from within
    if(event) event.stopPropagation();
    
    if(!confirm("정말로 이 문의를 취소(삭제)하시겠습니까?")) return;
    
    let inquiries = JSON.parse(localStorage.getItem('batech_inquiries') || '[]');
    inquiries = inquiries.filter(i => i.id !== id);
    localStorage.setItem('batech_inquiries', JSON.stringify(inquiries));
    
    alert("문의가 취소되었습니다.");
    document.getElementById('search-email').value = email;
    checkMyInquiry();
}

function startEditInquiry(id) {
    if(event) event.stopPropagation();
    document.getElementById('view_' + id).style.display = 'none';
    document.getElementById('edit_' + id).style.display = 'block';
}

function cancelEditInquiry(id) {
    document.getElementById('edit_' + id).style.display = 'none';
    document.getElementById('view_' + id).style.display = 'block';
}

function saveInquiry(id, email) {
    const newSubject = document.getElementById('edit_subject_' + id).value.trim();
    const newMessage = document.getElementById('edit_message_' + id).value.trim();
    
    if(!newSubject || !newMessage) {
        alert("제목과 내용을 모두 입력해주세요.");
        return;
    }
    
    let inquiries = JSON.parse(localStorage.getItem('batech_inquiries') || '[]');
    let inqIndex = inquiries.findIndex(i => i.id === id);
    if(inqIndex !== -1) {
        inquiries[inqIndex].subject = newSubject;
        inquiries[inqIndex].message = newMessage;
        localStorage.setItem('batech_inquiries', JSON.stringify(inquiries));
        alert("문의 내용이 성공적으로 수정되었습니다.");
    }
    
    document.getElementById('search-email').value = email;
    checkMyInquiry();
}

function toggleInquiryDetail(id) {
    const detailDiv = document.getElementById('detail_' + id);
    const arrowSpan = document.getElementById('arrow_' + id);
    if(detailDiv.style.display === 'none') {
        detailDiv.style.display = 'block';
        arrowSpan.style.transform = 'rotate(180deg)';
    } else {
        detailDiv.style.display = 'none';
        arrowSpan.style.transform = 'rotate(0deg)';
    }
}

function checkMyInquiry() {
    const email = document.getElementById('search-email').value.trim();
    const resultsDiv = document.getElementById('inquiry-results');
    
    if(!email) {
        alert("이메일 주소를 입력해주세요.");
        return;
    }
    
    let inquiries = JSON.parse(localStorage.getItem('batech_inquiries') || '[]');
    let myInquiries = inquiries.filter(i => i.email === email);
    
    if(myInquiries.length === 0) {
        resultsDiv.innerHTML = `<div style="text-align: center; color: #ef4444; padding: 30px;">해당 이메일로 접수된 문의 내역이 없습니다.</div>`;
        return;
    }
    
    let html = "";
    myInquiries.forEach(inq => {
        const isDone = inq.status === 'done';
        const statusBadge = isDone 
            ? `<span style="background: #dcfce7; color: #16a34a; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">처리 완료</span>`
            : `<span style="background: #ffedd5; color: #ea580c; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">답변 대기</span>`;
            
        let replyHtml = "";
        if(isDone && inq.reply) {
            replyHtml = `
                <div style="margin-top: 15px; padding: 15px; background: #f8fafc; border-left: 4px solid #3b82f6; border-radius: 0 8px 8px 0;">
                    <strong style="color: #1e293b; display: block; margin-bottom: 8px;">담당자 답변</strong>
                    <div style="color: #475569; font-size: 0.95rem; white-space: pre-wrap;">${inq.reply}</div>
                </div>
            `;
        }
        
        let actionButtons = "";
        if(!isDone) {
            actionButtons = `
                <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
                    <button onclick="startEditInquiry('${inq.id}')" style="background: white; border: 1px solid #cbd5e1; color: #475569; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='white'">수정</button>
                    <button onclick="deleteInquiry('${inq.id}', '${email}')" style="background: white; border: 1px solid #fca5a5; color: #ef4444; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='white'">취소(삭제)</button>
                </div>
            `;
        }
        
        html += `
            <div style="border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; overflow: hidden;">
                <!-- Accordion Header -->
                <div onclick="toggleInquiryDetail('${inq.id}')" style="padding: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; background: #ffffff; transition: 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#ffffff'">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            ${statusBadge}
                            <span style="color: #94a3b8; font-size: 0.9rem;">${inq.date}</span>
                        </div>
                        <span id="arrow_${inq.id}" style="color: #94a3b8; transition: transform 0.3s; display: inline-block;">▼</span>
                    </div>
                    <h3 style="margin: 0; font-size: 1.1rem; color: #0f172a;">${inq.subject}</h3>
                </div>
                
                <!-- Accordion Body (Detail) -->
                <div id="detail_${inq.id}" style="display: none; padding: 0 20px 20px 20px; border-top: 1px dashed #e2e8f0; margin-top: 5px;">
                    <div id="view_${inq.id}" style="padding-top: 15px;">
                        <strong style="color: #1e293b; display: block; margin-bottom: 8px;">문의 내용</strong>
                        <p style="margin: 0; color: #64748b; font-size: 0.95rem; white-space: pre-wrap;">${inq.message}</p>
                        ${replyHtml}
                        ${actionButtons}
                    </div>
                    
                    <div id="edit_${inq.id}" style="display: none; background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 15px;">
                        <strong style="color: #1e293b; display: block; margin-bottom: 10px;">문의 수정하기</strong>
                        <input type="text" id="edit_subject_${inq.id}" value="${inq.subject}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box;">
                        <textarea id="edit_message_${inq.id}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; min-height: 100px; margin-bottom: 10px; resize: vertical; box-sizing: border-box;">${inq.message}</textarea>
                        <div style="display: flex; justify-content: flex-end; gap: 10px;">
                            <button onclick="cancelEditInquiry('${inq.id}')" style="background: white; border: 1px solid #cbd5e1; color: #64748b; padding: 6px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;">취소</button>
                            <button onclick="saveInquiry('${inq.id}', '${email}')" style="background: #2563eb; border: none; color: white; padding: 6px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;">저장</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });
    
    resultsDiv.innerHTML = html;
}
</script>

<!-- Inquiry Check Modal -->
<dialog id="check-inquiry-modal" style="background: #ffffff; color: #1e293b; border: none; border-radius: 16px; padding: 2.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 600px; width: 100%; margin: 0; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-height: 85vh; overflow-y: auto;">
    <button onclick="this.closest('dialog').close()" style="position: absolute; top: 20px; right: 20px; background: transparent; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; padding: 5px; transition: 0.2s;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#94a3b8'">&#10005;</button>
    <h2 style="margin-top: 0; color: #1e293b; margin-bottom: 20px;">질문 내역 및 답변 조회</h2>
    
    <div style="display: flex; gap: 10px; margin-bottom: 30px;">
        <input type="email" id="search-email" placeholder="문의 시 등록한 이메일 주소 입력" style="background: #ffffff; flex: 1; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; color: #1e293b; box-sizing: border-box;">
        <button onclick="checkMyInquiry()" style="background: #2563eb; color: #ffffff; border: none; border-radius: 8px; padding: 12px 20px; font-weight: bold; cursor: pointer; white-space: nowrap;">조회</button>
    </div>
    
    <div id="inquiry-results" style="display: flex; flex-direction: column; gap: 20px;">
        <div style="text-align: center; color: #94a3b8; padding: 30px;">이메일 주소를 입력하고 조회해주세요.</div>
    </div>
</dialog>
<script src="lang.js"></script>
</body>
</html>
