    <!-- Portal Authentication Overlay -->
    <div id="portal-auth-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ffffff; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', 'Noto Sans KR', sans-serif; transition: opacity 0.3s ease;">
        <div style="background: #f8fafc; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%;">
            <div style="font-size: 3rem; margin-bottom: 15px;">🔒</div>
            <h2 style="margin: 0 0 10px 0; color: #0f172a;">B.A. TECH 사내 포털</h2>
            <p style="color: #64748b; margin-bottom: 25px; font-size: 0.95rem;">직원 전용 대시보드입니다.<br>접근 비밀번호를 입력해주세요.</p>
            
            <input type="password" id="portal-password" placeholder="비밀번호 입력" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; text-align: center; letter-spacing: 5px; box-sizing: border-box;" onkeypress="if(event.key === 'Enter') checkPortalAuth()">
            <button onclick="checkPortalAuth()" style="width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;">접속하기</button>
            <p id="auth-error" style="color: #ef4444; margin-top: 15px; font-size: 0.9rem; display: none;">비밀번호가 일치하지 않습니다.</p>
        </div>
    </div>
    <script>
        // Check session storage immediately
        if(sessionStorage.getItem('portal_auth') === 'true') {
            document.getElementById('portal-auth-overlay').style.display = 'none';
        }
        
        function checkPortalAuth() {
            const pwd = document.getElementById('portal-password').value;
            const errorP = document.getElementById('auth-error');
            if(pwd === '1234') {
                sessionStorage.setItem('portal_auth', 'true');
                document.getElementById('portal-auth-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('portal-auth-overlay').style.display = 'none';
                }, 300);
            } else {
                errorP.style.display = 'block';
                document.getElementById('portal-password').value = '';
                document.getElementById('portal-password').focus();
            }
        }
    </script>
